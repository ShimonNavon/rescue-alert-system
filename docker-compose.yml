services:
  db:
    image: postgis/postgis:17-3.5
    platform: linux/amd64
    container_name: rescue_alert_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # Bound to loopback: Docker's DNAT rules bypass ufw, so "5432:5432"
      # published this database straight to the internet. The backend reaches
      # it over the compose network (POSTGRES_HOST=db), not via this mapping.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: rescue_alert_backend
    restart: unless-stopped
    # entrypoint.sh waits for the database, applies migrations, collects static
    # files and then serves via gunicorn. The old "runserver" override ran
    # Django's single-threaded development server in production.
    command: ["/app/entrypoint.sh"]
    env_file:
      - .env
    ports:
      # nginx runs on the host and proxies to 127.0.0.1:8004, so loopback is
      # sufficient. Publishing on 0.0.0.0 exposed the app directly, bypassing
      # both nginx and ufw.
      - "127.0.0.1:8004:8000"
    depends_on:
      db:
        condition: service_healthy

  admin-panel:
    image: node:lts-alpine
    container_name: rescue_alert_admin
    # Development only: this is the Vite dev server. In production nginx serves
    # the built panel from admin-panel/dist, and this container was left running
    # (and had to be stopped by hand) after every `docker compose up -d`.
    # Start it with `docker compose --profile dev up`.
    profiles: ["dev"]
    working_dir: /app
    volumes:
      - ./admin-panel:/app
    ports:
      # Vite dev server -- local development only. In production nginx serves
      # the built admin panel from admin-panel/dist.
      - "127.0.0.1:5173:5173"
    command: sh -c "npm install && npm run dev -- --host"
    environment:
      - VITE_API_BASE_URL=http://localhost:8004/api/
    depends_on:
      - backend

volumes:
  postgres_data:
