<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rescue Alert — Get API Token</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 40px;
      max-width: 640px;
      width: 100%;
      box-shadow: 0 2px 16px rgba(0,0,0,0.1);
    }
    h1 { font-size: 20px; color: #333; margin-bottom: 8px; }
    p { color: #666; font-size: 14px; margin-bottom: 24px; }
    label { display: block; font-size: 13px; color: #444; margin: 14px 0 6px; }
    input {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
    }
    button {
      margin-top: 18px;
      width: 100%;
      padding: 12px;
      background: #1a73e8;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
    }
    button:hover { background: #1557b0; }
    button.secondary { background: #188038; margin-top: 10px; }
    button.secondary:hover { background: #116b2c; }
    .error { color: #d93025; font-size: 13px; margin-top: 14px; white-space: pre-wrap; }
    .token-section { display: none; margin-top: 24px; }
    textarea {
      width: 100%;
      height: 92px;
      font-family: monospace;
      font-size: 11px;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      resize: vertical;
      color: #333;
      background: #fafafa;
      margin-top: 6px;
    }
    .hint { font-size: 12px; color: #888; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Rescue Alert — Get API Token</h1>
    <p>Sign in with your Rescue Alert account to get a JWT for Postman or the API docs.</p>

    <form id="login-form">
      <label for="username">Email or username</label>
      <input id="username" autocomplete="username" required />
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required />
      <button id="submit" type="submit">Sign in</button>
      <div class="error" id="error-msg"></div>
    </form>

    <div class="token-section" id="token-section">
      <label for="access-token">Access token (1 hour)</label>
      <textarea id="access-token" readonly></textarea>
      <button class="secondary" id="copy-access" type="button">Copy access token</button>

      <label for="refresh-token">Refresh token (30 days)</label>
      <textarea id="refresh-token" readonly></textarea>
      <button class="secondary" id="copy-refresh" type="button">Copy refresh token</button>

      <div class="hint">
        In Swagger, click <strong>Authorize</strong> and paste the access token.
        Refresh with <code>POST /api/token/refresh/</code>.
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('login-form');
    const errorBox = document.getElementById('error-msg');
    const section = document.getElementById('token-section');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      errorBox.textContent = '';
      const button = document.getElementById('submit');
      button.disabled = true;
      button.textContent = 'Signing in...';

      try {
        const response = await fetch('/api/token/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value.trim(),
            password: document.getElementById('password').value,
          }),
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
          const detail = data.detail || data.non_field_errors || JSON.stringify(data);
          throw new Error(detail || `HTTP ${response.status}`);
        }
        document.getElementById('access-token').value = data.access || '';
        document.getElementById('refresh-token').value = data.refresh || '';
        section.style.display = 'block';
        form.style.display = 'none';
      } catch (error) {
        errorBox.textContent = error.message;
      } finally {
        button.disabled = false;
        button.textContent = 'Sign in';
      }
    });

    function copyFrom(id, button) {
      const text = document.getElementById(id).value;
      navigator.clipboard.writeText(text);
      const original = button.textContent;
      button.textContent = 'Copied!';
      setTimeout(() => { button.textContent = original; }, 1500);
    }

    document.getElementById('copy-access').addEventListener('click', (e) => copyFrom('access-token', e.target));
    document.getElementById('copy-refresh').addEventListener('click', (e) => copyFrom('refresh-token', e.target));
  </script>
</body>
</html>
