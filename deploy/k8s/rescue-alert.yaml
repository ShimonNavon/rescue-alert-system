apiVersion: v1
kind: Namespace
metadata:
  name: rescue-alert
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: rescue-alert
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: rescue-alert
  labels:
    app: rescue-alert-db
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rescue-alert-db
  template:
    metadata:
      labels:
        app: rescue-alert-db
    spec:
      nodeSelector:
        kubernetes.io/hostname: ubuntu04
      containers:
        - name: postgres
          image: postgis/postgis:17-3.5
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: rescue_alert
            - name: POSTGRES_USER
              value: rescue_user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rescue-alert-env
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "rescue_user", "-d", "rescue_alert"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "rescue_user", "-d", "rescue_alert"]
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: rescue-alert
spec:
  selector:
    app: rescue-alert-db
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: rescue-alert
  labels:
    app: rescue-alert-backend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rescue-alert-backend
  template:
    metadata:
      labels:
        app: rescue-alert-backend
    spec:
      # The local registry only listens on ubuntu04's loopback.
      nodeSelector:
        kubernetes.io/hostname: ubuntu04
      containers:
        - name: backend
          image: localhost:5000/ral-backend:k8s-20261019-0957-final
          imagePullPolicy: IfNotPresent
          command: ["/app/entrypoint.sh"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - secretRef:
                name: rescue-alert-env
          env:
            - name: POSTGRES_DB
              value: rescue_alert
            - name: POSTGRES_USER
              value: rescue_user
            - name: POSTGRES_HOST
              value: db
            - name: POSTGRES_PORT
              value: "5432"
          readinessProbe:
            httpGet:
              path: /api/docs/
              port: 8000
              httpHeaders:
                - name: Host
                  value: ubuntu03
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/docs/
              port: 8000
              httpHeaders:
                - name: Host
                  value: ubuntu03
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: rescue-alert
spec:
  selector:
    app: rescue-alert-backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin
  namespace: rescue-alert
  labels:
    app: rescue-alert-admin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rescue-alert-admin
  template:
    metadata:
      labels:
        app: rescue-alert-admin
    spec:
      nodeSelector:
        kubernetes.io/hostname: ubuntu04
      containers:
        - name: nginx
          image: localhost:5000/ral-admin:k8s-20261019-0957-final
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: admin
  namespace: rescue-alert
spec:
  type: NodePort
  selector:
    app: rescue-alert-admin
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30093
